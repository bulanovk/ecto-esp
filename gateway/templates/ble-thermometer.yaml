# Шаблон BLE-термометра LYWSD03MMC (прошивка pvvx, формат BTHome v2).
#
# vars:
#   smac   — MAC-адрес термометра
#   sname  — имя в HA (например "ATC Bedroom Temperature")
#   sid    — id сенсора; на него ссылается климат из packages/climate.yaml
#
# bindkey НЕ задаём — в прошивке термометра шифрование выключено, и режим должен
# совпадать строго: bthome_ble.cpp отбрасывает пакет и при `is_encrypted &&
# !has_bindkey_`, и при `!is_encrypted && has_bindkey_`. Включишь шифрование —
# добавь bindkey, иначе все пакеты будут молча теряться.
#
# filters: timeout: 5min — watchdog от «залипшего» последнего значения: если
# 5 минут не было пакетов, публикуется NAN и в HA датчик становится
# «Неизвестно» (HA отбрасывает не-конечные значения в native_value).
# 5 минут ≈ 30 подряд потерянных пакетов (термометр шлёт раз в ~10с), так что
# серия случайных потерь при слабом RSSI не даст ложного срабатывания.
platform: bthome_mithermometer
mac_address: "${smac}"
temperature:
  id: ${sid}
  name: "${sname}"
  filters:
    - timeout: 5min
